<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 420px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 20px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            padding: 25px;
            color: white;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .form-control {
            margin-bottom: 12px;
            border-radius: 10px;
            padding: 10px;
        }

        .btn-custom {
            width: 100%;
            background: #00c853;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
        }

        .btn-custom:hover {
            background: #00a844;
        }

        .result {
            margin-top: 15px;
            text-align: center;
            font-size: 18px;
            color: yellow;
        }

        p {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>House Price Prediction</h2>

    <form action="/predict" method="POST">

        <input type="text" name="bedrooms" class="form-control" placeholder="Bedrooms">
        <input type="text" name="bathrooms" class="form-control" placeholder="Bathrooms">

        <input type="text" name="sqft_living" class="form-control" placeholder="Sqft Living">
        <input type="text" name="sqft_lot" class="form-control" placeholder="Sqft Lot">

        <input type="text" name="floors" class="form-control" placeholder="Floors">
        <input type="text" name="waterfront" class="form-control" placeholder="Waterfront (0/1)">

        <input type="text" name="view" class="form-control" placeholder="View">
        <input type="text" name="condition" class="form-control" placeholder="Condition">

        <input type="text" name="sqft_above" class="form-control" placeholder="Sqft Above">
        <input type="text" name="sqft_basement" class="form-control" placeholder="Sqft Basement">

        <input type="text" name="yr_built" class="form-control" placeholder="Year Built">
        <input type="text" name="yr_renovated" class="form-control" placeholder="Year Renovated">

        <input type="text" name="city" class="form-control" placeholder="City">
        <input type="text" name="country" class="form-control" placeholder="Country">

        <button class="btn btn-custom">Predict Price</button>

    </form>

    <div class="result">
        Price: {{ prediction_text }}
    </div>

    <p>Project By <b>Laxman</b></p>
    <div>Data Scientist & ML Engineer</div>
        <div>📧 amgothlaxman@gmail.com</div>
        <div>📱 9182978008</div>


</div>

</body>
</html>
