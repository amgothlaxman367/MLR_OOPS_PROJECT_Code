<!DOCTYPE html>

<html>
<head>
    <title>House Price Prediction</title>

```
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;

        /* 🔥 Animated Background */
        background: linear-gradient(270deg, #1e3c72, #2a5298, #4facfe);
        background-size: 600% 600%;
        animation: gradientMove 10s ease infinite;
    }

    @keyframes gradientMove {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
    }

    /* HEADER */
    .header {
        text-align: center;
        padding: 25px;
        color: white;
    }

    .logo {
        width: 120px;
    }

    /* CONTAINER */
    .container {
        display: flex;
        padding: 30px;
        gap: 20px;
    }

    /* CARD */
    .card {
        background: rgba(255,255,255,0.95);
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0px 5px 20px rgba(0,0,0,0.3);
    }

    .left {
        width: 30%;
        text-align: center;
    }

    .right {
        width: 70%;
    }

    /* PROFILE IMAGE */
    .profile-container {
        width: 200px;
        height: 260px;
        margin: auto;
        overflow: hidden;
        border-radius: 20px;
        border: 4px solid #4facfe;
        box-shadow: 0px 5px 20px rgba(0,0,0,0.3);
    }

    .profile {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 20%;
    }

    /* INPUT GRID */
    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    /* INPUT STYLE */
    input {
        padding: 10px;
        border-radius: 10px;
        border: none;
        font-weight: bold;
    }

    input:nth-child(1) { background: #ffdde1; }
    input:nth-child(2) { background: #c2ffd8; }
    input:nth-child(3) { background: #cfd9ff; }
    input:nth-child(4) { background: #ffe0b2; }
    input:nth-child(5) { background: #d1c4e9; }
    input:nth-child(6) { background: #b2ebf2; }
    input:nth-child(7) { background: #f8bbd0; }
    input:nth-child(8) { background: #dcedc8; }
    input:nth-child(9) { background: #fff9c4; }
    input:nth-child(10){ background: #ffccbc; }
    input:nth-child(11){ background: #b3e5fc; }
    input:nth-child(12){ background: #e1bee7; }
    input:nth-child(13){ background: #c8e6c9; }
    input:nth-child(14){ background: #ffcdd2; }

    /* BUTTON */
    .btn {
        background: linear-gradient(90deg, #00f2fe, #4facfe);
        color: white;
        border: none;
        padding: 12px;
        margin-top: 15px;
        width: 100%;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        transition: 0.3s;
    }

    .btn:hover {
        transform: scale(1.05);
    }

    /* PREDICTION */
    .prediction {
        margin-top: 20px;
        padding: 15px;
        background: #e6fff2;
        border-left: 5px solid green;
        border-radius: 8px;
        font-size: 20px;
        color: green;
    }

</style>
```

</head>

<body>

```
<!-- HEADER -->
<div class="header">
    <img src="{{ url_for('static', filename='vihara logo.jpeg') }}" class="logo">
    <h1>🏢 Viharatech Private Limited</h1>
    <p>✨ House Price Prediction using Machine Learning</p>
</div>

<div class="container">

    <!-- LEFT -->
    <div class="card left">
        <div class="profile-container">
            <img src="{{ url_for('static', filename='photo for Lucky size .jpg') }}" class="profile">
        </div>

        <h2>👩‍💻 Amgoth Laxman </h2>
        <p><b>Data Analyst & ML Engineer</b></p>
        <p>Email: amgothlaxman367@gmail.com</p>
    </div>

    <!-- RIGHT -->
    <div class="card right">

        <h2>🏠 Enter House Details</h2>

        <form action="/predict" method="post">

            <div class="form-grid">
                <input type="number" step="any" name="bedrooms" placeholder="Bedrooms" required>
                <input type="number" step="any" name="bathrooms" placeholder="Bathrooms" required>
                <input type="number" step="any" name="sqft_living" placeholder="Sqft Living" required>
                <input type="number" step="any" name="sqft_lot" placeholder="Sqft Lot" required>
                <input type="number" step="any" name="floors" placeholder="Floors" required>
                <input type="number" name="waterfront" placeholder="Waterfront (0/1)" required>
                <input type="number" name="view" placeholder="View" required>
                <input type="number" name="condition" placeholder="Condition" required>
                <input type="number" name="sqft_above" placeholder="Sqft Above" required>
                <input type="number" name="sqft_basement" placeholder="Sqft Basement" required>
                <input type="number" name="yr_built" placeholder="Year Built" required>
                <input type="number" name="yr_renovated" placeholder="Year Renovated" required>
                <input type="number" name="city" placeholder="City (0-43)" required>
                <input type="number" name="country" placeholder="Country (0)" required>
            </div>

            <button class="btn">🚀 Predict Price</button>

        </form>

        {% if prediction_text %}
        <div class="prediction">
            {{ prediction_text }}
        </div>
        {% endif %}

    </div>

</div>
```

</body>
</html>
